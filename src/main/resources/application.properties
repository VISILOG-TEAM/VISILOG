# ============================================================
# VisiLog - application.properties
# Database is NOT connected yet - UserService still stores data
# in-memory, same as your original HashMap version. We'll add
# spring.datasource.* properties back here once the DB is wired up.
#
# Set these environment variables before running:
#   EMAIL_USER, EMAIL_PASS   (same Gmail App Password vars you already use)
# ============================================================

spring.application.name=visilog

# ---- Server ----
server.port=8080

# ---- Mail (Gmail SMTP) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
