spring:
  datasource:
    url: jdbc:h2:mem:visipro-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    # H2 in PostgreSQL mode understands our Postgres-flavoured migrations
    # closely enough for this schema (no Postgres-only extensions used).

visilog:
  jwt:
    secret: test-only-secret-key-visilog-not-for-prod-use-32bytes-min
    expiration-ms: 86400000
